<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Paciente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5" style="max-width: 800px;">
        <h1 class="mb-4">✏️ Editar Paciente #{{ paciente.id_paciente }}</h1>
        
        <div class="card shadow-sm">
            <div class="card-body">
                <form action="{{ url_for('paciente_editar', id_paciente=paciente.id_paciente) }}" method="POST" class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Nombre</label>
                        <input type="text" name="nombre" class="form-control" value="{{ paciente.nombre }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Apellido</label>
                        <input type="text" name="apellido" class="form-control" value="{{ paciente.apellido }}" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">DNI</label>
                        <input type="text" name="dni" class="form-control" value="{{ paciente.dni }}" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Fecha de Nacimiento</label>
                        <input type="date" name="fecha_nacimiento" class="form-control" value="{{ paciente.fecha_nacimiento }}" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Género</label>
                        <input type="text" name="genero" class="form-control" value="{{ paciente.genero }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Teléfono</label>
                        <input type="tel" name="telefono" class="form-control" value="{{ paciente.telefono }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Domicilio</label>
                        <input type="text" name="domicilio" class="form-control" value="{{ paciente.domicilio }}">
                    </div>
                    
                    <div class="col-12 mt-4">
                        <button type="submit" class="btn btn-warning">Guardar Cambios</button>
                        <a href="{{ url_for('pacientes_index') }}" class="btn btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
