<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Médico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5" style="max-width: 600px;">
        <!-- 'medico' es la variable que pasamos desde la ruta GET de app.py -->
        <h1 class="mb-4">✏️ Editar Médico #{{ medico.id_medico }}</h1>
        
        <div class="card shadow-sm">
            <div class="card-body">
                <!-- El formulario se envía a la misma ruta (POST) -->
                <form action="{{ url_for('medico_editar', id_medico=medico.id_medico) }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" name="nombre" class="form-control" value="{{ medico.nombre }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Apellido</label>
                        <input type="text" name="apellido" class="form-control" value="{{ medico.apellido }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Especialidad</label>
                        <input type="text" name="especialidad" class="form-control" value="{{ medico.especialidad }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Teléfono</label>
                        <input type="text" name="telefono" class="form-control" value="{{ medico.telefono }}">
                    </div>
                    
                    <button type="submit" class="btn btn-warning">Guardar Cambios</button>
                    <!-- Enlace para volver a la lista principal de médicos -->
                    <a href="{{ url_for('medicos_index') }}" class="btn btn-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
